name: GradleMC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.warning.mode=all"

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate maintained repository surface
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations
          import re
          import sys
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml")
          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          errors = 0

          if workflows != [workflow]:
              print("::error file=.github/workflows::Only the maintained ci.yml workflow is allowed")
              errors += 1

          text = workflow.read_text(encoding="utf-8")
          forbidden_trigger = "pull_request" + "_target:"
          if forbidden_trigger in text:
              print(f"::error file={workflow}::Untrusted pull requests must never run in a privileged target context")
              errors += 1
          if re.search(r"^\s+(?:contents|pull-requests|actions|id-token):\s+write\s*$", text, re.MULTILINE):
              print(f"::error file={workflow}::CI must remain read-only")
              errors += 1
          for match in re.finditer(r"^\s*uses:\s*([^\s#]+)", text, re.MULTILINE):
              action = match.group(1)
              if not action.startswith("./") and not re.fullmatch(r"[^/]+/[^@]+@[0-9a-f]{40}", action):
                  line = text.count("\n", 0, match.start()) + 1
                  print(f"::error file={workflow},line={line}::Action is not pinned to an immutable commit: {action}")
                  errors += 1

          sys.exit(1 if errors else 0)
          PY

          while IFS= read -r -d '' path; do
            case "$path" in
              */build/*|*/.gradle/*|*.class|*.tmp|*.bak|*.orig|*.rej)
                echo "::warning file=$path::Generated, temporary, or backup file is tracked"
                ;;
              *.jar)
                case "$path" in
                  */gradle/wrapper/gradle-wrapper.jar|Releases/*.jar|Releases/**/*.jar) ;;
                  *) echo "::warning file=$path::Unexpected JAR is tracked outside Releases/ or a Gradle wrapper" ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          secret_pattern='(gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----)'
          if git grep -IInE "$secret_pattern" -- . \
            ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)*.jpeg' \
            ':(exclude)*.webp' ':(exclude)*.gif' ':(exclude)*.jar'; then
            echo "::warning::Possible credential-shaped text found; review matches above"
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install actionlint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflow
        shell: bash
        run: |
          set -euo pipefail
          actionlint .github/workflows/ci.yml

  select-projects:
    name: Select projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-projects: ${{ steps.select.outputs.has-projects }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Select affected Gradle projects
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          from pathlib import Path

          projects = [
              {"name":"Forge 1.21.11","runner":"ubuntu-latest","project_dir":"GradleMC/Forge/Minecraft 1.21.11","java":"21","command":"clean check gradlemcSelfTest assemble","kind":"forge"},
              {"name":"Forge 26.1.2","runner":"ubuntu-latest","project_dir":"GradleMC/Forge/Minecraft 26.1.2","java":"25","command":"clean build","kind":"forge"},
              {"name":"Forge 1.20.1","runner":"windows-latest","project_dir":"GradleMC/Forge/Minecraft 1.20.1","java":"17","command":"clean check assemble","kind":"forge"},
              {"name":"Fabric 1.21.11","runner":"ubuntu-latest","project_dir":"GradleMC/Fabric/Minecraft 1.21.11","java":"21","command":"clean build","kind":"fabric"},
              {"name":"Fabric 26.1.2","runner":"ubuntu-latest","project_dir":"GradleMC/Fabric/Minecraft 26.1.2","java":"25","command":"clean build","kind":"fabric"},
              {"name":"Fabric 1.20.1","runner":"windows-latest","project_dir":"GradleMC/Fabric/Minecraft 1.20.1","java":"17","command":"clean build","kind":"fabric"},
              {"name":"NeoForge 1.21.11","runner":"ubuntu-latest","project_dir":"GradleMC/NeoForge/Minecraft 1.21.11","java":"21","command":"clean check gradlemcSelfTest assemble","kind":"neoforge"},
              {"name":"NeoForge 26.1.2","runner":"ubuntu-latest","project_dir":"GradleMC/NeoForge/Minecraft 26.1.2","java":"25","command":"clean build","kind":"neoforge"},
          ]

          event_name = os.environ["GITHUB_EVENT_NAME"]
          selected = projects

          def changed_between(base: str, head: str) -> list[str] | None:
              if not base or not head or set(base) == {"0"}:
                  return None
              result = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRT", base, head],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              return [line for line in result.stdout.splitlines() if line]

          changed: list[str] | None = None
          if event_name in {"pull_request", "push"}:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              if event_name == "pull_request":
                  changed = changed_between(
                      event["pull_request"]["base"]["sha"],
                      event["pull_request"]["head"]["sha"],
                  )
              else:
                  changed = changed_between(event.get("before", ""), event.get("after", ""))

          if changed is not None:
              if any(path.startswith(".github/") for path in changed):
                  selected = projects
              else:
                  selected = [
                      project
                      for project in projects
                      if any(path.startswith(project["project_dir"] + "/") for path in changed)
                  ]

          matrix = {"include": selected}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write("has-projects=" + ("true" if selected else "false") + "\n")

          print("Changed files:")
          if changed is None:
              print(" - unavailable; running the full matrix")
          elif changed:
              for path in changed:
                  print(" - " + path)
          else:
              print(" - none")

          print("Selected projects:")
          if selected:
              for project in selected:
                  print(" - " + project["name"])
          else:
              print(" - none (no Gradle project changed)")
          PY

  build-supported-port:
    name: Build ${{ matrix.name }}
    needs: [select-projects]
    if: needs.select-projects.outputs.has-projects == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select-projects.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.project_dir }}/**/*.gradle
            ${{ matrix.project_dir }}/**/*.gradle.kts
            ${{ matrix.project_dir }}/gradle.properties
            ${{ matrix.project_dir }}/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null
          distribution_url="$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | tail -n 1)"
          distribution_url="${distribution_url//\\:/:}"
          [[ "$distribution_url" == https://services.gradle.org/distributions/gradle-*-bin.zip ]]
          ./gradlew --no-daemon --version

      - name: Resolve project metadata
        id: metadata
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | tail -n 1; }

          mod_version="$(property mod_version)"
          if [[ -z "$mod_version" ]]; then
            mod_version="$(property version)"
          fi
          minecraft_version="$(property minecraft_version)"

          if [[ -z "$mod_version" ]]; then
            echo "::error file=gradle.properties::Neither mod_version nor version is defined"
            exit 1
          fi
          if [[ -z "$minecraft_version" ]]; then
            echo "::error file=gradle.properties::minecraft_version is not defined"
            exit 1
          fi

          echo "mod-version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft-version=$minecraft_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all ${{ matrix.command }} 2>&1 | tee ci-gradle.log

      - name: Verify built JAR
        id: verify
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        env:
          KIND: ${{ matrix.kind }}
          MOD_VERSION: ${{ steps.metadata.outputs.mod-version }}
          MINECRAFT_VERSION: ${{ steps.metadata.outputs.minecraft-version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          lib = Path("build/libs")
          kind = os.environ["KIND"]
          excluded_suffixes = ("-sources.jar", "-javadoc.jar", "-dev.jar", "-all.jar")
          jars = sorted(
              path for path in lib.glob("*.jar")
              if path.is_file() and not path.name.endswith(excluded_suffixes)
          )

          metadata_entry = {
              "forge": "META-INF/mods.toml",
              "neoforge": "META-INF/neoforge.mods.toml",
              "fabric": "fabric.mod.json",
          }[kind]
          required = {
              "forge": ["META-INF/MANIFEST.MF", "META-INF/mods.toml", "pack.mcmeta"],
              "neoforge": ["META-INF/MANIFEST.MF", "META-INF/neoforge.mods.toml", "pack.mcmeta"],
              "fabric": ["META-INF/MANIFEST.MF", "fabric.mod.json"],
          }[kind]

          candidates: list[Path] = []
          details: list[str] = []

          for jar_path in jars:
              try:
                  with zipfile.ZipFile(jar_path) as jar:
                      names = set(jar.namelist())
                      if metadata_entry not in names:
                          details.append(f"{jar_path.name}: missing {metadata_entry}")
                          continue
                      metadata = jar.read(metadata_entry).decode("utf-8")
                      valid_id = (
                          bool(re.search(r'"id"\s*:\s*"gradlemc"', metadata))
                          if kind == "fabric"
                          else bool(re.search(r'modId\s*=\s*"gradlemc"', metadata))
                      )
                      if not valid_id:
                          details.append(f"{jar_path.name}: metadata does not identify gradlemc")
                          continue
                      missing = [entry for entry in required if entry not in names]
                      if missing:
                          details.append(f"{jar_path.name}: missing packaged entries {missing}")
                          continue
                      if "${" in metadata:
                          details.append(f"{jar_path.name}: metadata still contains an unexpanded placeholder")
                          continue
                      candidates.append(jar_path)
              except (OSError, zipfile.BadZipFile, UnicodeDecodeError) as exc:
                  details.append(f"{jar_path.name}: unreadable JAR ({exc})")

          if len(candidates) != 1:
              print(f"::error file={lib}::Expected exactly one verified GradleMC release JAR, found {len(candidates)}")
              print("JAR inspection:")
              for detail in details:
                  print(" - " + detail)
              print("Candidate files:")
              for path in jars:
                  print(" - " + path.name)
              sys.exit(1)

          artifact = candidates[0]
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest().upper()
          size = artifact.stat().st_size

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(
                  f"### {artifact.name}\n"
                  f"- Minecraft: `{os.environ['MINECRAFT_VERSION']}`\n"
                  f"- Mod: `{os.environ['MOD_VERSION']}`\n"
                  f"- Loader kind: `{kind}`\n"
                  f"- Size: `{size}` bytes\n"
                  f"- SHA-256: `{digest}`\n"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact-name={artifact.name}\n")

          print(f"Verified {artifact} ({size} bytes, SHA-256 {digest})")
          PY

      - name: Upload verified JAR
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verify.outputs.artifact-name }}
          path: ${{ matrix.project_dir }}/build/libs/${{ steps.verify.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-failure-${{ matrix.name }}
          path: |
            ${{ matrix.project_dir }}/ci-gradle.log
            ${{ matrix.project_dir }}/build/reports/**
            ${{ matrix.project_dir }}/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - repository-sanity
      - workflow-lint
      - select-projects
      - build-supported-port
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          set -euo pipefail
          repository="${{ needs.repository-sanity.result }}"
          lint="${{ needs.workflow-lint.result }}"
          selection="${{ needs.select-projects.result }}"
          build="${{ needs.build-supported-port.result }}"

          echo "repository-sanity: $repository"
          echo "workflow-lint: $lint"
          echo "select-projects: $selection"
          echo "build-supported-port: $build"

          [[ "$repository" == success ]]
          [[ "$lint" == success ]]
          [[ "$selection" == success ]]
          [[ "$build" == success || "$build" == skipped ]]
