name: GradleMC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.warning.mode=all"

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate maintained repository surface
        shell: bash
        run: |
          set -euo pipefail

          stale=(
            .github/workflows/release-sync-1.0.3.yml
            .github/workflows/release-sync-ready.yml
            .github/workflows/release-sync-new-pr.yml
            .github/workflows/release-sync-auto-merge.yml
            .github/workflows/scheduled-v1.0.3-finalizer.yml
            .github/workflows/post-merge-v1.0.3-finalizer.yml
            .github/scripts/release_sync_1_0_3.py
          )

          for path in "${stale[@]}"; do
            [[ ! -e "$path" ]] || { echo "::error file=$path::Obsolete v1.0.3 automation is still active"; exit 1; }
          done

          while IFS= read -r -d '' path; do
            case "$path" in
              */build/*|*/.gradle/*|*.class|*.tmp|*.bak|*.orig|*.rej)
                echo "::warning file=$path::Generated, temporary, or backup file is tracked"
                ;;
              *.jar)
                case "$path" in
                  */gradle/wrapper/gradle-wrapper.jar|Releases/*.jar|Releases/**/*.jar) ;;
                  *) echo "::warning file=$path::Unexpected JAR is tracked outside Releases/ or a Gradle wrapper" ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          python3 - <<'PY'
          from __future__ import annotations
          import re
          import sys
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          errors = 0
          if workflows != [workflow]:
              print('::error file=.github/workflows::Only the maintained ci.yml workflow is allowed')
              errors += 1
          text = workflow.read_text(encoding='utf-8')
          forbidden_trigger = 'pull_request' + '_target:'
          if forbidden_trigger in text:
              print(f'::error file={workflow}::pull_request_target is forbidden')
              errors += 1
          if re.search(r'^\s+(?:contents|pull-requests|actions|id-token):\s+write\s*$', text, re.MULTILINE):
              print(f'::error file={workflow}::CI must remain read-only')
              errors += 1
          for match in re.finditer(r'^\s*uses:\s*([^\s#]+)', text, re.MULTILINE):
              action = match.group(1)
              if not action.startswith('./') and not re.fullmatch(r'[^/]+/[^@]+@[0-9a-f]{40}', action):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'::error file={workflow},line={line}::Action is not pinned to an immutable commit: {action}')
                  errors += 1
          sys.exit(1 if errors else 0)
          PY

          secret_pattern='(gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----)'
          if git grep -IInE "$secret_pattern" -- . \
            ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)*.jpeg' \
            ':(exclude)*.webp' ':(exclude)*.gif' ':(exclude)*.jar'; then
            echo "::warning::Possible credential-shaped text found; review matches above"
          fi

  select-projects:
    name: Select projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-projects: ${{ steps.select.outputs.has-projects }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Select affected Gradle projects
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          from pathlib import Path

          projects = [
              {'name':'Forge 1.21.11','runner':'ubuntu-latest','project_dir':'GradleMC/Forge/Minecraft 1.21.11','java':'21','command':'clean check gradlemcSelfTest assemble','kind':'forge'},
              {'name':'Forge 26.1.2','runner':'ubuntu-latest','project_dir':'GradleMC/Forge/Minecraft 26.1.2','java':'25','command':'clean build','kind':'forge'},
              {'name':'Forge 1.20.1','runner':'windows-latest','project_dir':'GradleMC/Forge/Minecraft 1.20.1','java':'17','command':'clean check gradlemcSelfTest runGameTestServer assemble','kind':'forge'},
              {'name':'Fabric 1.21.11','runner':'ubuntu-latest','project_dir':'GradleMC/Fabric/Minecraft 1.21.11','java':'21','command':'clean build','kind':'fabric'},
              {'name':'Fabric 26.1.2','runner':'ubuntu-latest','project_dir':'GradleMC/Fabric/Minecraft 26.1.2','java':'25','command':'clean build','kind':'fabric'},
              {'name':'Fabric 1.20.1','runner':'ubuntu-latest','project_dir':'GradleMC/Fabric/Minecraft 1.20.1','java':'17','command':'clean build','kind':'fabric'},
              {'name':'NeoForge 1.21.11','runner':'ubuntu-latest','project_dir':'GradleMC/NeoForge/Minecraft 1.21.11','java':'21','command':'clean check gradlemcSelfTest assemble','kind':'neoforge'},
              {'name':'NeoForge 26.1.2','runner':'ubuntu-latest','project_dir':'GradleMC/NeoForge/Minecraft 26.1.2','java':'25','command':'clean build','kind':'neoforge'},
          ]

          selected = projects
          changed: list[str] = []
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              result = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMRT',
                   event['pull_request']['base']['sha'], event['pull_request']['head']['sha']],
                  check=True, text=True, stdout=subprocess.PIPE,
              )
              changed = [line for line in result.stdout.splitlines() if line]
              ci_changed = any(path.startswith('.github/') for path in changed)
              affected = [
                  project for project in projects
                  if any(path.startswith(project['project_dir'] + '/') for path in changed)
              ]
              if affected:
                  selected = affected
              elif not ci_changed:
                  selected = []

          matrix = {'include': selected}
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              output.write('has-projects=' + ('true' if selected else 'false') + '\n')
          print('Selected projects:')
          for project in selected:
              print(' - ' + project['name'])
          if not selected:
              print(' - none (documentation-only pull request)')
          PY

  build-supported-port:
    name: Build ${{ matrix.name }}
    needs: [select-projects]
    if: needs.select-projects.outputs.has-projects == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-projects.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.project_dir }}/**/*.gradle
            ${{ matrix.project_dir }}/**/*.gradle.kts
            ${{ matrix.project_dir }}/gradle.properties
            ${{ matrix.project_dir }}/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null
          distribution_url="$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | tail -n 1)"
          distribution_url="${distribution_url//\\:/:}"
          [[ "$distribution_url" == https://services.gradle.org/distributions/gradle-*-bin.zip ]]
          ./gradlew --no-daemon --version

      - name: Resolve artifact metadata
        id: metadata
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | tail -n 1; }
          mod_version="$(property mod_version)"
          minecraft_version="$(property minecraft_version)"
          test -n "$mod_version"
          test -n "$minecraft_version"
          case "${{ matrix.kind }}" in
            forge|neoforge)
              artifact_name="$(property artifact_name)"
              [[ "$(property mod_id)" == gradlemc ]]
              ;;
            fabric)
              archives_base_name="$(property archives_base_name)"
              test -n "$archives_base_name"
              artifact_name="${archives_base_name}-${mod_version}.jar"
              ;;
          esac
          [[ "$artifact_name" =~ ^[A-Za-z0-9._+-]+\.jar$ ]]
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "mod-version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft-version=$minecraft_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all ${{ matrix.command }} 2>&1 | tee ci-gradle.log

      - name: Verify built JAR
        id: verify
        shell: bash
        working-directory: ${{ matrix.project_dir }}
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact-name }}
          KIND: ${{ matrix.kind }}
          MOD_VERSION: ${{ steps.metadata.outputs.mod-version }}
          MINECRAFT_VERSION: ${{ steps.metadata.outputs.minecraft-version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import os
          import sys
          import zipfile
          from pathlib import Path

          artifact = Path('build/libs') / os.environ['ARTIFACT_NAME']
          kind = os.environ['KIND']
          if not artifact.is_file():
              print(f'::error file={artifact}::Expected JAR is missing')
              sys.exit(1)
          required = {
              'forge': ['META-INF/MANIFEST.MF', 'META-INF/mods.toml', 'pack.mcmeta'],
              'neoforge': ['META-INF/MANIFEST.MF', 'META-INF/neoforge.mods.toml', 'pack.mcmeta'],
              'fabric': ['META-INF/MANIFEST.MF', 'fabric.mod.json'],
          }[kind]
          metadata_entry = {
              'forge': 'META-INF/mods.toml',
              'neoforge': 'META-INF/neoforge.mods.toml',
              'fabric': 'fabric.mod.json',
          }[kind]
          with zipfile.ZipFile(artifact) as jar:
              missing = [entry for entry in required if entry not in set(jar.namelist())]
              if missing:
                  print(f'::error file={artifact}::Missing packaged entries: {missing}')
                  sys.exit(1)
              metadata = jar.read(metadata_entry).decode('utf-8')
              valid_id = ('"id": "gradlemc"' in metadata or '"id":"gradlemc"' in metadata) if kind == 'fabric' else ('modId="gradlemc"' in metadata or 'modId = "gradlemc"' in metadata)
              if not valid_id or '${' in metadata:
                  print(f'::error file={artifact}::Packaged metadata is invalid or unexpanded')
                  sys.exit(1)
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest().upper()
          size = artifact.stat().st_size
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f"### {artifact.name}\n- Minecraft: `{os.environ['MINECRAFT_VERSION']}`\n- Mod: `{os.environ['MOD_VERSION']}`\n- Size: `{size}` bytes\n- SHA-256: `{digest}`\n")
          print(f'Verified {artifact} ({size} bytes, SHA-256 {digest})')
          PY
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload verified JAR
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verify.outputs.artifact-name }}
          path: ${{ matrix.project_dir }}/build/libs/${{ steps.verify.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-failure-${{ matrix.name }}
          path: |
            ${{ matrix.project_dir }}/ci-gradle.log
            ${{ matrix.project_dir }}/build/reports/**
            ${{ matrix.project_dir }}/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [repository-sanity, select-projects, build-supported-port]
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          set -euo pipefail
          repository="${{ needs.repository-sanity.result }}"
          selection="${{ needs.select-projects.result }}"
          build="${{ needs.build-supported-port.result }}"
          echo "repository-sanity: $repository"
          echo "select-projects: $selection"
          echo "build-supported-port: $build"
          [[ "$repository" == success ]]
          [[ "$selection" == success ]]
          [[ "$build" == success || "$build" == skipped ]]
